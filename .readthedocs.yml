version: 2

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats: []

build:
  os: ubuntu-24.04
  tools:
    python: '3.14'
  jobs:
    post_create_environment:
    - pip install uv==0.12.13
    install:
    - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --active --inexact --no-default-groups --group docs

submodules:
  exclude: all
