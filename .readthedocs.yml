version: 2

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats: []

build:
  os: ubuntu-26.04
  tools:
    python: '3.14'

python:
  install:
  - method: uv
    command: sync
    groups:
    - docs

submodules:
  exclude: all
