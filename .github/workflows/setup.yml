name: Distribution

on:
  push:
    branches:
    - main
    tags:
    - '*'
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    name: Build packages
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false
        version: 0.12.17
    - name: Install distribution tools
      run: uv sync --locked --only-group dist
    - name: Verify release version
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python - <<'PYTHON'
        import os
        import tomllib
        from pathlib import Path

        version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        tag = os.environ["RELEASE_TAG"]
        if tag not in (version, f"v{version}"):
            raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
        PYTHON
    - name: Install release notes converter
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        sudo apt-get update
        sudo apt-get install --yes pandoc
    - name: Generate release notes
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: python ci/release_notes.py "$RELEASE_TAG" docs/changes.rst "$RUNNER_TEMP/release-notes.md"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        path: ${{ runner.temp }}/release-notes.md
        name: release-notes
        if-no-files-found: error
    - name: build
      run: uv build --no-sources
    - name: twine
      run: uv run --locked --no-sync twine check dist/*
    - name: pydistcheck
      run: uv run --locked --no-sync pydistcheck --inspect dist/*
    - name: pyroma
      run: uv run --locked --no-sync pyroma dist/*.tar.gz
    - name: check-wheel-contents
      run: uv run --locked --no-sync check-wheel-contents dist/*.whl
    - name: check-manifest
      run: uv run --locked --no-sync check-manifest -v

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: dist/*
        name: dist

  test:
    name: Test distributions
    needs:
    - setup
    uses: $/.github/workflows/test.yml

  android:
    name: Verify Android compatibility
    needs:
    - setup
    uses: $/.github/workflows/android.yml

  release_pypi:
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags') && github.repository == 'WeblateOrg/arsc-writer'
    runs-on: ubuntu-26.04
    name: Publish release to PyPI
    permissions:
      # this permission is mandatory for trusted publishing
      id-token: write
    needs:
    - setup
    - test
    - android
    steps:
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: 0.12.17
        enable-cache: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist
    - name: Publish package
      run: uv publish --trusted-publishing always

  release_github:
    runs-on: ubuntu-26.04
    name: Create release on GitHub
    permissions:
      contents: write
    needs:
    - setup
    - test
    - android
    if: startsWith(github.ref, 'refs/tags/')  && github.repository == 'WeblateOrg/arsc-writer'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-notes
        path: ${{ runner.temp }}/release-notes
    - name: Publish GitHub release
      env:
        VERSION: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$VERSION" --verify-tag --draft --notes-file "$RUNNER_TEMP/release-notes/release-notes.md" dist/*
        gh release edit "$VERSION" --draft=false
