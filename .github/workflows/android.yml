name: Android resources

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=gradle-version depName=gradle versioning=gradle
  GRADLE_VERSION: 9.8.2

jobs:
  android:
    name: ARSC on Android API ${{ matrix.api-level }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.6
        cache-suffix: android
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 25.0.5+8.0.LTS
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        gradle-version: ${{ env.GRADLE_VERSION }}
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Install test dependencies and built wheel
      run: |
        uv sync --locked --no-default-groups --group test --no-install-project
        uv pip install --no-deps dist/*.whl
    - name: Validate ARSC with AAPT2
      working-directory: ${{ runner.temp }}
      run: |
        test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
        AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2" "$GITHUB_WORKSPACE/.venv/bin/python" -I -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests" -v
    - name: Generate resource fixtures
      working-directory: ${{ runner.temp }}
      run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/ci/android-arsc/generate-fixtures.py"'
    - name: Build instrumentation harness
      run: gradle -p ci/android-arsc --no-daemon --stacktrace --warning-mode all assembleDebug assembleDebugAndroidTest
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Test resource loading on Android
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        disable-animations: true
        disable-linux-hw-accel: false
        script: gradle -p ci/android-arsc --no-daemon --stacktrace --warning-mode all connectedDebugAndroidTest
    - name: Upload Android test reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: android-arsc-api-${{ matrix.api-level }}
        path: |
          ci/android-arsc/build/reports/androidTests/
          ci/android-arsc/build/reports/problems/
          ci/android-arsc/build/outputs/androidTest-results/
          ci/android-arsc/build/generated/assets/
        retention-days: 14
