name: Android resources

on:
  workflow_call:

permissions:
  contents: read

env:
  # renovate: datasource=gradle-version depName=gradle versioning=gradle
  GRADLE_VERSION: 9.7.1

jobs:
  android:
    name: ARSC on Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 36]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14'
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: 0.12.13
        cache-suffix: android
        save-cache: ${{ github.ref == 'refs/heads/main' }}
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 25.0.4+101.0.LTS
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        gradle-version: ${{ env.GRADLE_VERSION }}
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: platform-tools platforms;android-35 build-tools;35.0.0
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist
    - name: Install test dependencies and built wheel
      run: |
        uv sync --locked --no-default-groups --group test --no-install-project
        uv pip install --no-deps dist/*.whl
    - name: Validate ARSC with AAPT2
      working-directory: ${{ runner.temp }}
      run: |
        test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
        AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2" "$GITHUB_WORKSPACE/.venv/bin/python" -I -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests" -v
    - name: Generate resource fixtures
      working-directory: ${{ runner.temp }}
      run: '"$GITHUB_WORKSPACE/.venv/bin/python" -I "$GITHUB_WORKSPACE/ci/android-arsc/generate-fixtures.py"'
    - name: Build instrumentation harness
      run: gradle -p ci/android-arsc --no-daemon --stacktrace --warning-mode all assembleDebug assembleDebugAndroidTest
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Test resource loading on Android
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        disable-animations: true
        disable-linux-hw-accel: false
        script: gradle -p ci/android-arsc --no-daemon --stacktrace --warning-mode all connectedDebugAndroidTest
    - name: Upload Android test reports
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: android-arsc-api-${{ matrix.api-level }}
        path: |
          ci/android-arsc/build/reports/androidTests/
          ci/android-arsc/build/reports/problems/
          ci/android-arsc/build/outputs/androidTest-results/
          ci/android-arsc/build/generated/assets/
        retention-days: 14
