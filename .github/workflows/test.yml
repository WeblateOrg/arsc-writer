name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-26.04
        artifact: [whl]
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        - '3.15'
        include:
        - os: windows-2025
          python-version: '3.12'
          artifact: whl
        - os: macos-15
          python-version: '3.12'
          artifact: whl
        - os: windows-2025
          python-version: '3.15'
          artifact: whl
        - os: macos-15
          python-version: '3.15'
          artifact: whl
        - os: ubuntu-26.04
          python-version: '3.12'
          artifact: tar.gz
        - os: ubuntu-26.04
          python-version: '3.15'
          artifact: tar.gz
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.artifact }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: 0.13.5
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Install test tools
      run: uv sync --locked --no-default-groups --group test --no-install-project
    - name: Install distribution
      shell: bash
      env:
        ARTIFACT: ${{ matrix.artifact }}
      run: uv pip install --no-deps dist/*."$ARTIFACT"
    - name: Test installed distribution
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        PYTHON_EXECUTABLE: ${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      run: |
        "$GITHUB_WORKSPACE/.venv/$PYTHON_EXECUTABLE" -I -c "import sys; from pathlib import Path; import arsc_writer; assert Path(arsc_writer.__file__).is_relative_to(Path(sys.prefix)), arsc_writer.__file__"
        "$GITHUB_WORKSPACE/.venv/$PYTHON_EXECUTABLE" -I -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"

permissions:
  contents: read
