name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
        - ubuntu-24.04
        - windows-2025
        - macos-15
        artifact: ['*.whl']
        python-version:
        - '3.12'
        - '3.13'
        - '3.14'
        exclude:
        - os: windows-2025
          python-version: '3.13'
        - os: macos-15
          python-version: '3.13'
        include:
        - os: ubuntu-24.04
          python-version: '3.12'
          artifact: '*.tar.gz'
        - os: ubuntu-24.04
          python-version: '3.14'
          artifact: '*.tar.gz'
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.artifact }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: 0.12.13
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: dist
        path: dist
    - name: Install test tools
      run: uv sync --locked --no-default-groups --group test --no-install-project
    - name: Install distribution
      shell: bash
      env:
        ARTIFACT: ${{ matrix.artifact }}
      run: uv pip install --no-deps dist/$ARTIFACT
    - name: Test installed distribution
      working-directory: ${{ runner.temp }}
      shell: bash
      env:
        PYTHON_EXECUTABLE: ${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }}
      run: |
        "$GITHUB_WORKSPACE/.venv/$PYTHON_EXECUTABLE" -I -c "import sys; from pathlib import Path; import arsc_writer; assert Path(arsc_writer.__file__).is_relative_to(Path(sys.prefix)), arsc_writer.__file__"
        "$GITHUB_WORKSPACE/.venv/$PYTHON_EXECUTABLE" -I -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests"

permissions:
  contents: read
