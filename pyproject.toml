[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.13,<0.13"]

[dependency-groups]
dev = [
  { include-group = "dist" },
  { include-group = "docs" },
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "types" }
]
dist = [
  "check-manifest==0.51",
  "check-wheel-contents==0.6.3",
  "pydistcheck==0.11.3",
  "pyroma==5.0.1",
  "twine==7.0.0"
]
docs = [
  "furo==2025.12.19",
  "Sphinx==9.1.0"
]
lint = [
  { include-group = "pre-commit" }
]
pre-commit = [
  "prek==0.5.2"
]
test = [
  "pytest==9.1.1"
]
types = [
  "mypy==2.3.1",
  "ty==0.0.81",
  "types-lxml==2026.2.16",
  { include-group = "docs" }
]

[project]
authors = [
  { email = "michal@weblate.org", name = "Michal Čihař" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Internationalization",
  "Topic :: Software Development :: Localization"
]
dependencies = ["lxml>=6.1.3"]
description = "A pure-Python library for generating Android resource tables (ARSC) with support for strings, plurals, and styled text."
keywords = ["android", "arsc", "i18n", "l10n", "weblate"]
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
name = "arsc-writer"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.urls]
Changelog = "https://arsc-writer.readthedocs.io/en/latest/changes.html"
Documentation = "https://arsc-writer.readthedocs.io/"
Funding = "https://weblate.org/donate/"
Homepage = "https://github.com/WeblateOrg/arsc-writer"
"Issue Tracker" = "https://github.com/WeblateOrg/arsc-writer/issues"
"Source Code" = "https://github.com/WeblateOrg/arsc-writer"

[tool.check-manifest]
ignore = [
  ".editorconfig",
  ".github/**",
  ".pre-commit-config.yaml",
  ".readthedocs.yml",
  ".yamllint.yml",
  "AGENTS.md",
  "ci/**",
  # uv_build preserves the original when rewriting the sdist's TOML.
  "pyproject.toml.orig",
  "REUSE.toml",
  "uv.lock"
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "COM",
  "incorrect-blank-line-before-class",
  "line-too-long",
  "multi-line-summary-first-line",
  "single-line-implicit-string-concatenation"
]
preview = true
select = ["ALL"]

[tool.ruff.lint.flake8-copyright]
min-file-size = 2
notice-rgx = "(?i)Copyright\\s+©\\s+"

[tool.ruff.lint.per-file-ignores]
# The fixture generator is a standalone script, not an import package.
"ci/android-arsc/*.py" = [
  "implicit-namespace-package"
]
# Release tooling is a standalone script invoking the installed Pandoc command.
"ci/release_notes.py" = [
  "implicit-namespace-package",
  "start-process-with-partial-path",
  "subprocess-without-shell-equals-true"
]
# Sphinx loads its configuration as a standalone module.
"docs/conf.py" = [
  "implicit-namespace-package"
]
# Binary-format widths and sentinels are kept beside their encodings.
"src/arsc_writer/writer.py" = [
  "magic-value-comparison"
]
"tests/**" = [
  "assert",
  "implicit-namespace-package"
]
# Release tooling tests invoke the current Python interpreter.
"tests/test_release_notes.py" = [
  "subprocess-without-shell-equals-true"
]
# AAPT2 is explicitly supplied by the developer or CI, never resource input.
"tests/test_writer.py" = [
  "subprocess-without-shell-equals-true"
]

[tool.rumdl]
disable = [
  # We do not enforce heading
  "first-line-heading",
  # Avoid length limit checks
  "line-length"
]

[tool.rumdl.per-file-ignores]
"README.md" = [
  # Allow HTML
  "MD033"
]

[tool.tomlsort]
ignore_case = true
sort_inline_arrays = true
sort_inline_tables = true
sort_table_keys = true
spaces_before_inline_comment = 2

[tool.uv.build-backend]
source-exclude = ["docs/_build/**"]
source-include = ["docs/**", "SECURITY.md", "tests/**"]
